<ul class="menu w-full gap-0.5 menu-sm p-0">
  <li class="flex flex-row items-center justify-between menu-title px-2">
    <span>History</span>
    <span class="flex items-center gap-1">
      <span class="badge badge-ghost badge-sm">{{ totalSessions() }}</span>
      <button
        type="button"
        (click)="reloadHistory.emit(); $event.stopPropagation()"
        class="btn btn-ghost btn-xs"
        aria-label="Reload history"
        [disabled]="isReloading()"
      >
        <svg
          lucideRefreshCw
          class="h-3.5 w-3.5"
          [class.animate-spin]="isReloading()"
        />
      </button>
    </span>
  </li>
  @for (item of sessions(); track item.id) {
    <li class="group relative w-full overflow-hidden">
      @if (editingSessionId() === item.id) {
        <div class="flex w-full min-w-0 items-center gap-1 px-1 py-1">
          <input
            #editInput
            type="text"
            [value]="editTitle()"
            (input)="editTitle.set(editInput.value)"
            (keyup.enter)="saveRename(item.id)"
            (keyup.escape)="cancelRename()"
            class="input min-w-0 flex-1 input-sm"
            placeholder="Session title"
          />
          <button
            type="button"
            (click)="saveRename(item.id)"
            class="btn shrink-0 btn-ghost text-success btn-xs"
            aria-label="Save"
          >
            <svg lucideCheck class="h-4 w-4" />
          </button>
          <button
            type="button"
            (click)="cancelRename()"
            class="btn shrink-0 btn-ghost btn-xs"
            aria-label="Cancel"
          >
            <svg lucideX class="h-4 w-4" />
          </button>
        </div>
      } @else {
        <button
          type="button"
          (click)="sessionClick.emit(item.id)"
          [class.menu-active]="activeSessionId() === item.id"
          class="flex w-full min-w-0 items-center gap-2 pr-16 text-left"
        >
          <svg lucideMessageCircle class="h-4 w-4 shrink-0 opacity-60" />
          <span class="min-w-0 flex-1 overflow-hidden">
            <span
              class="block truncate text-[13px] leading-tight"
              [innerHTML]="highlightedTitle(item.title)"
            ></span>
            <span
              class="mt-0.5 block truncate text-[10px] leading-snug opacity-50"
              >{{ item.learningLanguage | uppercase }} &bull;
              {{ item.createdAt | date: 'shortDate' }}</span
            >
          </span>
        </button>
        <!-- Action buttons: always reserved space (pr-16 on button above) -->
        <span
          class="pointer-events-none absolute top-1/2 right-1.5 flex -translate-y-1/2 gap-0.5 rounded-lg bg-base-200/95 p-0.5 opacity-0 shadow-md backdrop-blur-sm transition-opacity duration-150 group-focus-within:pointer-events-auto group-focus-within:opacity-100 group-hover:pointer-events-auto group-hover:opacity-100"
        >
          <button
            type="button"
            (click)="startRename(item.id, item.title); $event.stopPropagation()"
            class="btn btn-ghost btn-xs"
            aria-label="Rename"
          >
            <svg lucidePencil class="h-3.5 w-3.5" />
          </button>

          @if (confirmDeleteId() === item.id) {
            <button
              type="button"
              (click)="confirmDelete(item.id); $event.stopPropagation()"
              class="btn animate-pulse btn-ghost text-error btn-xs"
              aria-label="Confirm Delete"
            >
              <svg lucideCheck class="h-3.5 w-3.5" />
            </button>
          } @else {
            <button
              type="button"
              (click)="initDelete(item.id); $event.stopPropagation()"
              class="btn btn-ghost text-error/60 btn-xs hover:text-error"
              aria-label="Delete"
            >
              <svg lucideTrash2 class="h-3.5 w-3.5" />
            </button>
          }
        </span>
      }
    </li>
  } @empty {
    <li
      class="menu-disabled flex flex-col items-center gap-2 py-8 text-center italic"
    >
      <svg lucideMessageCircle class="h-8 w-8 opacity-50" />
      <span>No history yet</span>
    </li>
  }
</ul>
