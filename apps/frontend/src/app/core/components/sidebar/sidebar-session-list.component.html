<div class="px-2 py-1.5 text-xs font-semibold text-base-content/50 uppercase tracking-wider flex items-center justify-between">
  <span>History</span>
  <span class="text-base-content/40 text-[10px] normal-case">{{ totalSessions() }} chats</span>
</div>

@for (item of sessions(); track item.id) {
  <div class="group relative">
    @if (editingSessionId() === item.id) {
      <div class="px-3 py-2 rounded-lg bg-base-300 border border-primary/50 flex items-center gap-2">
        <input 
          #editInput
          type="text" 
          [value]="editTitle()"
          (input)="editTitle.set(editInput.value)"
          (keyup.enter)="saveRename(item.id)"
          (keyup.escape)="cancelRename()"
          class="flex-1 bg-transparent text-sm text-base-content outline-none placeholder:text-base-content/40"
          placeholder="Session title"
        />
        <button type="button" (click)="saveRename(item.id)" class="text-success hover:text-success/80 p-1 cursor-pointer">
          <svg lucideCheck class="w-4 h-4"></svg>
        </button>
        <button type="button" (click)="cancelRename()" class="text-base-content/40 hover:text-base-content/60 p-1 cursor-pointer">
          <svg lucideX class="w-4 h-4"></svg>
        </button>
      </div>
    } @else {
      <button 
        type="button"
        (click)="sessionClick.emit(item.id)"
        class="w-full text-left px-2.5 py-2 rounded-lg text-sm truncate transition-all flex items-center gap-2.5"
        [class.bg-primary/20]="activeSessionId() === item.id"
        [class.text-primary]="activeSessionId() === item.id"
        [class.text-base-content/70]="activeSessionId() !== item.id"
        [class.hover:bg-base-300/50]="activeSessionId() !== item.id"
        [class.group-hover:text-base-content]="activeSessionId() !== item.id">
        <svg 
          lucideMessageCircle
          class="w-4 h-4 transition-colors shrink-0"
          [class.text-primary]="activeSessionId() === item.id"
          [class.text-base-content/40]="activeSessionId() !== item.id"
          [class.group-hover:text-primary]="activeSessionId() !== item.id"></svg>
        <div class="flex-1 min-w-0">
          <div class="truncate text-[13px]">{{ item.title }}</div>
          <div class="text-[10px] text-base-content/40 truncate">{{ item.learningLanguage | uppercase }} • {{ item.createdAt | date:'shortDate' }}</div>
        </div>
      </button>
      <div class="absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all flex gap-1 bg-base-300/90 rounded-lg p-0.5 shadow-lg backdrop-blur-sm">
        <button type="button" (click)="startRename(item.id, item.title); $event.stopPropagation()" class="btn btn-ghost btn-xs" title="Rename">
          <svg lucidePencil class="w-3.5 h-3.5"></svg>
        </button>
        
        @if (confirmDeleteId() === item.id) {
          <button type="button" (click)="confirmDelete(item.id); $event.stopPropagation()" class="btn btn-ghost btn-xs text-error animate-pulse" title="Confirm Delete">
            <svg lucideCheck class="w-3.5 h-3.5"></svg>
          </button>
        } @else {
          <button type="button" (click)="initDelete(item.id); $event.stopPropagation()" class="btn btn-ghost btn-xs text-error/60 hover:text-error" title="Delete">
            <svg lucideTrash2 class="w-3.5 h-3.5"></svg>
          </button>
        }
      </div>
    }
  </div>
} @empty {
  <div class="px-3 py-8 text-sm text-base-content/40 italic text-center flex flex-col items-center gap-2">
    <svg lucideMessageCircle class="w-8 h-8 opacity-50"></svg>
    No history yet
  </div>
}
