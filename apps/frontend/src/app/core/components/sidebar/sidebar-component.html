@if (isOpen() && isMobile) {
<div
  class="fixed inset-0 bg-black/50 z-20 backdrop-blur-sm transition-opacity"
  (click)="toggle()"
  (keyup.enter)="toggle()"
  tabindex="0"
  role="button"
  aria-label="Close sidebar overlay"
></div>
}

<aside
  class="fixed md:relative z-30 h-full bg-base-200 border-r border-base-300 transition-all duration-300 ease-in-out flex flex-col shadow-2xl"
  [class.w-72]="isOpen() && !isCollapsed()"
  [class.w-16]="isOpen() && isCollapsed()"
  [class.w-0]="!isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.md:opacity-100]="true"
  [class.overflow-hidden]="!isOpen()"
>
  <div
    class="p-5 border-b border-base-300 flex items-center gap-3 bg-base-300/50"
  >
    @if (!isCollapsed()) {
    <div
      class="font-bold text-lg bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent whitespace-nowrap flex items-center gap-2 flex-1"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="url(#gradient)"
        class="w-6 h-6 shrink-0"
      >
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color: oklch(var(--p))" />
            <stop offset="100%" style="stop-color: oklch(var(--s))" />
          </linearGradient>
        </defs>
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.159 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"
        />
      </svg>
      Live Teacher
    </div>
    }

    <button
      (click)="toggleCollapse()"
      class="md:hidden btn btn-ghost btn-circle btn-sm"
      [class.mx-auto]="isCollapsed()"
      title="Toggle sidebar"
    >
      <svg
        lucideChevronLeft
        class="w-5 h-5 transition-transform duration-300"
        [class.rotate-180]="isCollapsed()"
      ></svg>
    </button>
  </div>

  @if (!isCollapsed()) {
  <div class="p-4">
    <button (click)="onNewChat()" class="btn btn-primary w-full">
      <svg lucidePlus class="w-5 h-5"></svg>
      <span class="font-medium">New Chat</span>
    </button>
  </div>

  <div class="px-4 pb-2">
    <div class="relative">
      <div
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <svg lucideSearch class="w-4 h-4 text-base-content/50"></svg>
      </div>
      <input
        type="text"
        placeholder="Search history..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        class="input input-bordered input-sm w-full pl-9"
      />
    </div>
  </div>

  <div
    class="flex-1 overflow-y-auto px-2 scrollbar-thin scrollbar-thumb-base-300 hover:scrollbar-thumb-base-content/30"
  >
    <app-sidebar-session-list
      [sessions]="displayedSessions()"
      [totalSessions]="filteredSessions().length"
      [activeSessionId]="activeSessionId()"
      (sessionClick)="onSessionClick($event)"
      (renameSession)="renameSession.emit($event)"
      (deleteSession)="deleteSession.emit($event)"
    >
    </app-sidebar-session-list>

    @if (hasMoreSessions()) {
    <button
      type="button"
      (click)="showMore()"
      class="btn btn-ghost btn-sm w-full mt-1"
    >
      <svg lucideChevronDown class="w-3 h-3"></svg>
      {{ remainingCount() }} more
    </button>
    } @if (showingAll() && filteredSessions().length > initialLimit) {
    <div
      class="sticky bottom-0 pt-2 pb-1 bg-gradient-to-t from-base-200 via-base-200 to-transparent"
    >
      <button
        type="button"
        (click)="showLess()"
        class="btn btn-ghost btn-sm w-full"
      >
        <svg lucideChevronUp class="w-3 h-3"></svg>
        Show less
      </button>
    </div>
    }
  </div>
  } @else {
  <div class="flex-1 flex flex-col items-center py-4 space-y-2">
    <button
      (click)="onNewChat()"
      class="btn btn-primary btn-circle"
      title="New Chat"
    >
      <svg lucidePlus class="w-5 h-5"></svg>
    </button>
  </div>
  }

  <div class="p-4 border-t border-base-300 bg-base-300/50">
    @if (!isCollapsed()) {
    <app-user-menu (openSettings)="openSettings.emit()"></app-user-menu>
    } @else {
    <button
      (click)="openSettings.emit()"
      class="btn btn-ghost btn-circle w-full"
      title="Settings"
    >
      <svg lucideSettings class="w-5 h-5"></svg>
    </button>
    }
  </div>
</aside>
