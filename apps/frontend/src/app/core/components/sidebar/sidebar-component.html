@if (isOpen() && isMobile) {
<div
  class="fixed inset-0 z-20 bg-base-content/40 backdrop-blur-sm transition-opacity"
  (click)="toggle()"
  (keyup.enter)="toggle()"
  tabindex="0"
  role="button"
  aria-label="Close sidebar overlay"
></div>
}

<aside
  class="fixed z-30 flex h-full flex-col overflow-hidden border-r border-base-300 bg-base-200 shadow-2xl transition-all duration-300 ease-in-out md:relative"
  [class.w-72]="isOpen() && !isCollapsed()"
  [class.w-16]="isOpen() && isCollapsed()"
  [class.w-0]="!isOpen()"
  [class.opacity-0]="!isOpen()"
  [class.md:opacity-100]="true"
>
  <div
    class="flex items-center gap-3 border-b border-base-300 bg-base-300/50 p-5"
    [class.justify-center]="isCollapsed() && !isMobile"
  >
    @if (!isCollapsed()) {
    <div
      class="flex flex-1 items-center gap-2 text-lg font-bold whitespace-nowrap"
    >
      <img [src]="logoSrc()" alt="Live Teacher" class="h-8 w-8 shrink-0" />
    </div>
    } @if (isMobile) {
    <button
      (click)="toggle()"
      class="btn btn-circle btn-ghost"
      title="Close sidebar"
      aria-label="Close sidebar"
    >
      <svg lucidePanelRightClose class="h-5 w-5"></svg>
    </button>
    } @else {
    <button
      (click)="toggleCollapse()"
      class="btn btn-circle btn-ghost"
      title="Toggle sidebar"
    >
      @if (isCollapsed()) {
      <svg lucidePanelRightOpen class="h-5 w-5"></svg>
      } @else {
      <svg lucidePanelRightClose class="h-5 w-5"></svg>
      }
    </button>
    }
  </div>

  @if (!isCollapsed()) {
  <div class="flex gap-2 p-4">
    <button
      (click)="onNewChat()"
      class="btn flex-1 gap-2 btn-primary"
      title="New Chat"
    >
      <svg lucideMessageCirclePlus class="h-5 w-5"></svg>
      <span>New Chat</span>
    </button>
    <button
      (click)="openSearch()"
      class="btn btn-square btn-ghost"
      title="Search history (Ctrl+K)"
      aria-label="Search history"
    >
      <svg lucideSearch class="h-5 w-5"></svg>
    </button>
  </div>

  <div
    class="scrollbar-thin scrollbar-thumb-base-300 hover:scrollbar-thumb-base-content/30 flex-1 overflow-y-auto px-2"
  >
    <app-sidebar-session-list
      [sessions]="displayedSessions()"
      [totalSessions]="sessions().length"
      [activeSessionId]="activeSessionId()"
      [isReloading]="isReloading()"
      (sessionClick)="onSessionClick($event)"
      (renameSession)="renameSession.emit($event)"
      (deleteSession)="deleteSession.emit($event)"
      (reloadHistory)="reloadHistory.emit()"
    />

    @if (hasMoreSessions()) {
    <button
      type="button"
      (click)="showMore()"
      class="btn mt-1 w-full btn-ghost btn-sm"
    >
      <svg lucideChevronDown class="h-3 w-3"></svg>
      {{ remainingCount() }} more
    </button>
    } @if (showingAll() && sessions().length > initialLimit) {
    <div
      class="sticky bottom-0 bg-gradient-to-t from-base-200 via-base-200 to-transparent pt-2 pb-1"
    >
      <button
        type="button"
        (click)="showLess()"
        class="btn w-full btn-ghost btn-sm"
      >
        <svg lucideChevronUp class="h-3 w-3"></svg>
        Show less
      </button>
    </div>
    }
  </div>
  } @else {
  <div class="flex flex-1 flex-col items-center space-y-2 py-4">
    <button
      (click)="openSearch()"
      class="btn btn-circle btn-ghost"
      title="Search"
    >
      <svg lucideSearch class="h-5 w-5"></svg>
    </button>
  </div>
  }

  <div class="border-t border-base-300 bg-base-300/50 p-4">
    @if (canInstall()) {
    <button
      (click)="onInstall()"
      class="btn mb-2 w-full gap-2 btn-outline btn-secondary btn-sm"
      title="Install app"
    >
      <svg lucideDownload class="h-4 w-4"></svg>
      @if (!isCollapsed()) {
      <span>Install App</span>
      }
    </button>
    } @if (!isCollapsed()) {
    <app-user-menu (openSettings)="openSettings.emit()" />
    } @else {
    <button
      (click)="openSettings.emit()"
      class="btn btn-circle w-full btn-ghost"
      title="Settings"
    >
      <svg lucideSettings class="h-5 w-5"></svg>
    </button>
    }
  </div>
</aside>

<!-- Search Modal — état et filtre encapsulés dans le composant dédié -->
@if (showSearchModal()) {
<app-sidebar-search-modal
  [sessions]="sessions()"
  [activeSessionId]="activeSessionId()"
  [isReloading]="isReloading()"
  (sessionSelected)="onSessionClick($event)"
  (renameSession)="renameSession.emit($event)"
  (deleteSession)="deleteSession.emit($event)"
  (reloadHistory)="reloadHistory.emit()"
  (closed)="closeSearch()"
/>
}
