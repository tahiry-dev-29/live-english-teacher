@for (n of notifications(); track n.id) {
  <div class="toast toast-center">
    <div [class]="alertClass(n.type)">
      @if (n.type === 'info') {
        <svg lucideInfo class="h-5 w-5 shrink-0" />
      }
      @if (n.type === 'success') {
        <svg lucideCheckCircle class="h-5 w-5 shrink-0" />
      }
      @if (n.type === 'warning') {
        <svg lucideAlertTriangle class="h-5 w-5 shrink-0" />
      }
      @if (n.type === 'error') {
        <svg lucideAlertCircle class="h-5 w-5 shrink-0" />
      }
      <button
        type="button"
        class="btn btn-circle btn-ghost btn-xs"
        aria-label="Dismiss"
        (click)="dismiss.emit(n.id)"
      >
        <svg lucideX class="h-4 w-4" />
      </button>
      <span class="flex-1 text-sm">{{ n.message }}</span>
    </div>
  </div>
}
