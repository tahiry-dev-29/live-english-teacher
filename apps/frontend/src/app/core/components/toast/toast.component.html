<div
  class="pointer-events-none toast toast-center toast-top w-full max-w-md px-4 pt-4"
  style="z-index: 9999"
>
  @for (n of notifications(); track n.id) {
    <div
      [class]="alertClass(n.type)"
      class="pointer-events-auto flex items-center gap-2.5 rounded-xl border border-base-300/50 px-4 py-3 text-sm shadow-lg backdrop-blur-md transition-all duration-300"
    >
      @if (n.type === 'info') {
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-info/15"
        >
          <svg lucideInfo class="h-4 w-4 text-info" />
        </div>
      }
      @if (n.type === 'success') {
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-success/15"
        >
          <svg lucideCheckCircle class="h-4 w-4 text-success" />
        </div>
      }
      @if (n.type === 'warning') {
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-warning/15"
        >
          <svg lucideAlertTriangle class="h-4 w-4 text-warning" />
        </div>
      }
      @if (n.type === 'error') {
        <div
          class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-error/15"
        >
          <svg lucideAlertCircle class="h-4 w-4 text-error" />
        </div>
      }
      <span class="flex-1 text-xs font-medium">{{ n.message }}</span>
      <button
        type="button"
        class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md transition-colors hover:bg-base-content/10"
        aria-label="Dismiss"
        (click)="dismiss.emit(n.id)"
      >
        <svg lucideX class="h-3.5 w-3.5 opacity-50 hover:opacity-100" />
      </button>
    </div>
  }
</div>
