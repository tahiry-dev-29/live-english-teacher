<div class="flex h-screen bg-base-100 text-base-content overflow-hidden">
  @if (isLiveMode()) {
  <app-call-interface
    [callState]="voiceCallService.callState()"
    [transcript]="voiceCallService.currentTranscript()"
    (endCall)="toggleLiveMode()"
    (toggleMute)="toggleVocal()"
  />
  }

  <app-sidebar
    (newChat)="onNewChat()"
    [sessions]="sessions() ?? []"
    [activeSessionId]="chatService.activeSessionId()"
    (sessionSelected)="loadSession($event)"
    (renameSession)="onRenameSession($event)"
    (deleteSession)="onDeleteSession($event)"
    (openSettings)="showSettings.set(true)"
    #sidebar
  />

  <app-settings-dialog
    [isOpen]="showSettings()"
    [languages]="languageService.languages"
    [selectedLanguage]="languageService.selectedLanguageCode()"
    (closed)="showSettings.set(false)"
    (languageChange)="languageService.setLanguage($event)"
  />

  <main
    class="flex-1 flex flex-col relative w-full h-full transition-all duration-300"
  >
    <!-- Quota exhausted banner -->
    @if (messageService.quotaExceeded()) {
    <div
      role="alert"
      class="alert alert-warning shadow-lg rounded-none border-x-0 border-t-0 flex items-center gap-3 px-4 py-3"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
        />
      </svg>
      <span class="flex-1 text-sm">
        <strong
          >Server quota exhausted ({{
            messageService.quotaExceeded() | uppercase
          }}).</strong
        >
        Add your own free API key to keep chatting.
      </span>
      <button
        type="button"
        class="btn btn-sm btn-warning btn-outline font-semibold"
        (click)="openSettingsOnApiTab()"
      >
        🔑 Add my key
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-circle btn-xs"
        aria-label="Dismiss"
        (click)="messageService.quotaExceeded.set(null)"
      >
        ✕
      </button>
    </div>
    }

    <div
      class="md:hidden p-4 bg-base-200 border-b border-base-300 flex items-center justify-between"
    >
      <div class="flex items-center gap-2">
        <button
          (click)="sidebar.toggle()"
          class="btn btn-ghost btn-circle btn-sm"
          title="Toggle sidebar"
        >
          <svg lucidePanelRightOpen class="w-5 h-5"></svg>
        </button>
        <span
          class="font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent"
          >Live Teacher</span
        >
      </div>
      <button
        (click)="onNewChat()"
        class="btn btn-primary btn-circle btn-sm"
        title="New Chat"
      >
        <svg lucideMessageCircle class="w-5 h-5"></svg>
      </button>
    </div>

    <app-chat-container
      [messages]="messages()"
      [loading]="loading()"
      [isPlaying]="ttsService.isPlaying()"
      [showVoiceControl]="showVoiceControl()"
      [currentAudioTime]="ttsService.currentAudioTime()"
      [totalAudioDuration]="ttsService.totalAudioDuration()"
      [playingMessageIndex]="playingMessageIndex()"
      [learningLanguage]="
        currentSession()?.learningLanguage ||
        languageService.selectedLanguageCode()
      "
      (playAudio)="handlePlayAudio($event)"
      (stop)="handleStopAudio()"
    />

    <div class="p-4">
      <app-chat-input
        [value]="userInput()"
        [disabled]="loading()"
        [isLoading]="loading()"
        [isPlaying]="ttsService.isPlaying()"
        [isRecording]="isAudioRecording()"
        [isLiveActive]="isLiveMode()"
        (valueChange)="userInput.set($event)"
        (messageSent)="sendMessage()"
        (audioRecorded)="handleAudioRecorded($event)"
        (stop)="handleStopAudio()"
        (recordingStateChange)="handleRecordingStateChange($event)"
        (liveToggled)="toggleLiveMode()"
      />

      <div class="text-center mt-2">
        <p class="text-[10px] text-base-content/50">
          <a href="https://tahiry29.is-a.dev" target="_blank" rel="noopener"
            >Powered by tahiry29</a
          >
        </p>
      </div>
    </div>
  </main>
</div>
