<div class="flex h-screen overflow-hidden bg-base-100 text-base-content">
  @if (isLiveMode()) {
    <app-call-interface
      [callState]="voiceCallService.callState()"
      [transcript]="voiceCallService.currentTranscript()"
      (endCall)="toggleLiveMode()"
      (toggleMute)="toggleVocal()"
    />
  }

  <app-sidebar
    (newChat)="onNewChat()"
    [sessions]="sessions()"
    [activeSessionId]="chatService.activeSessionId()"
    [isReloading]="chatService.sessionsResource.isLoading()"
    (sessionSelected)="loadSession($event)"
    (renameSession)="onRenameSession($event)"
    (deleteSession)="onDeleteSession($event)"
    (reloadHistory)="chatService.sessionsResource.reload()"
    (openSettings)="showSettings.set(true)"
    #sidebar
  />

  <app-settings-dialog
    [isOpen]="showSettings()"
    [languages]="languageService.languages"
    [selectedLanguage]="languageService.selectedLanguageCode()"
    (closed)="showSettings.set(false)"
    (languageChange)="languageService.setLanguage($event)"
  />

  <main
    class="relative flex h-full w-full flex-1 flex-col transition-all duration-300"
  >
    <!-- Quota exhausted banner -->
    @if (messageService.quotaExceeded()) {
      <div
        role="alert"
        class="alert alert-horizontal rounded-none border-x-0 border-t-0 alert-warning shadow-lg sm:alert-horizontal"
      >
        <svg lucideTriangleAlert class="h-5 w-5 shrink-0"></svg>
        <span class="flex-1 text-sm">
          <strong>{{ quotaBannerTitle() }}</strong>
          {{ quotaBannerBody }}
        </span>
        <button
          type="button"
          class="btn btn-outline btn-sm btn-warning"
          (click)="openSettingsOnApiTab()"
        >
          <svg lucideKeyRound class="h-4 w-4"></svg>
          {{ quotaBannerAction }}
        </button>
        <button
          type="button"
          class="btn btn-circle btn-ghost btn-xs"
          aria-label="Dismiss"
          (click)="dismissQuotaAlert()"
        >
          <svg lucideX class="h-4 w-4"></svg>
        </button>
      </div>
    }

    <!-- Toast notifications -->
    <app-toast
      [notifications]="notificationService.notifications()"
    ></app-toast>

    <div class="navbar border-b border-base-300 bg-base-200 md:hidden">
      <div class="navbar-start">
        <button
          (click)="sidebar.toggle()"
          class="btn btn-circle btn-ghost btn-sm"
          aria-label="Toggle sidebar"
        >
          <svg lucidePanelRightOpen class="h-5 w-5"></svg>
        </button>
        <span
          class="bg-gradient-to-r from-primary to-secondary bg-clip-text font-bold text-transparent"
          >Live Teacher</span
        >
      </div>
      <div class="navbar-end">
        <div class="tooltip tooltip-bottom" data-tip="New Chat">
          <button
            (click)="onNewChat()"
            class="btn btn-circle btn-primary btn-sm"
            aria-label="New Chat"
          >
            <svg lucideMessageCircle class="h-5 w-5"></svg>
          </button>
        </div>
      </div>
    </div>

    <app-chat-container
      [messages]="messages()"
      [loading]="loading()"
      [isPlaying]="ttsService.isPlaying()"
      [showVoiceControl]="showVoiceControl()"
      [currentAudioTime]="ttsService.currentAudioTime()"
      [totalAudioDuration]="ttsService.totalAudioDuration()"
      [playingMessageIndex]="playingMessageIndex()"
      [learningLanguage]="
        currentSession()?.learningLanguage ||
        languageService.selectedLanguageCode()
      "
      (playAudio)="handlePlayAudio($event)"
      (stop)="handleStopAudio()"
      (retryMessage)="onRetryMessage($event)"
      (forkSession)="onForkSession($event)"
    />

    <div class="p-4">
      <app-chat-input
        [value]="userInput()"
        [disabled]="loading()"
        [isLoading]="loading()"
        [isPlaying]="ttsService.isPlaying()"
        [isRecording]="isAudioRecording()"
        [isLiveActive]="isLiveMode()"
        (valueChange)="userInput.set($event)"
        (messageSent)="sendMessage()"
        (audioRecorded)="handleAudioRecorded($event)"
        (stop)="handleStopAudio()"
        (recordingStateChange)="handleRecordingStateChange($event)"
        (liveToggled)="toggleLiveMode()"
      />

      <div class="mt-2 text-center">
        <p class="text-[10px] text-base-content/50">
          <a href="https://tahiry29.is-a.dev" target="_blank" rel="noopener"
            >Powered by tahiry29</a
          >
        </p>
      </div>
    </div>
  </main>
</div>
