<div class="relative h-full flex flex-col">
  @if (showVoiceControl()) {
  <div
    class="absolute top-4 left-1/2 transform -translate-x-1/2 z-20 w-full max-w-md px-4 transition-all duration-300 ease-in-out"
  >
    <app-voice-control
      [currentTime]="currentAudioTime()"
      [totalDuration]="totalAudioDuration()"
      (stopped)="onStopAudio()"
    >
    </app-voice-control>
  </div>
  }

  <div
    class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth"
    #scrollContainer
    (scroll)="onScroll()"
  >
    @if (showVoiceControl()) {
    <div class="h-16"></div>
    } @if (messages().length === 0 && !loading()) {
    <app-chat-welcome [learningLanguage]="learningLanguage()"></app-chat-welcome>
    } @for (message of messages(); track $index) {
    <app-message-item
      [message]="message"
      [isPlaying]="isPlaying() && playingMessageIndex() === $index"
      (playRequested)="onPlayMessage($index, message.text)"
      (stop)="onStopAudio()"
    >
    </app-message-item>
    } @if (loading()) {
    <div class="flex justify-start animate-pulse">
      <div
        class="bg-base-200 backdrop-blur-sm rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-2 border border-base-300"
      >
        <div class="flex gap-1.5">
          <div
            class="w-2 h-2 bg-primary rounded-full animate-bounce"
            style="animation-delay: 0ms"
          ></div>
          <div
            class="w-2 h-2 bg-secondary rounded-full animate-bounce"
            style="animation-delay: 150ms"
          ></div>
          <div
            class="w-2 h-2 bg-warning rounded-full animate-bounce"
            style="animation-delay: 300ms"
          ></div>
        </div>
      </div>
    </div>
    }

    <div class="h-4"></div>
  </div>

  @if (showScrollButton()) {
  <button
    (click)="scrollToBottom()"
    class="absolute bottom-6 right-6 p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-full shadow-lg shadow-blue-900/30 transition-all transform hover:scale-110 active:scale-95 z-10 flex items-center justify-center group"
  >
    <svg lucideArrowDown class="w-5 h-5 group-hover:animate-bounce"></svg>
    @if (hasNewMessages()) {
    <span
      class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-gray-900"
    ></span>
    }
  </button>
  }
</div>
