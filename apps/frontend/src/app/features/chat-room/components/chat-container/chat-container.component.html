<div class="relative flex h-full flex-col">
  @if (showVoiceControl()) {
    <div
      class="absolute top-4 left-1/2 z-20 w-full max-w-md -translate-x-1/2 transform px-4 transition-all duration-300 ease-in-out"
    >
      <app-voice-control
        [currentTime]="currentAudioTime()"
        [totalDuration]="totalAudioDuration()"
        (stopped)="onStopAudio()"
      />
    </div>
  }

  <div
    class="flex flex-1 flex-col space-y-4 overflow-y-auto scroll-smooth p-4"
    #scrollContainer
    (scroll)="onScroll()"
  >
    @if (showVoiceControl()) {
      <div class="h-16"></div>
    }
    @if (messages().length === 0 && !loading()) {
      <app-chat-welcome
        [learningLanguage]="learningLanguage()"
        class="flex-1"
      />
    }
    <!-- $index volontaire : flux de messages séquentiels sans identifiant UUID individuel côté client -->
    @for (message of messages(); track $index) {
      <app-message-item
        [message]="message"
        [isPlaying]="isPlaying() && playingMessageIndex() === $index"
        (playRequested)="onPlayMessage($index, message.text)"
        (stop)="onStopAudio()"
        (retry)="retryMessage.emit($index)"
        (fork)="forkSession.emit($index)"
      />
    }
    @if (loading()) {
      <div class="mt-auto flex animate-pulse justify-start">
        <div
          class="flex items-center gap-2 rounded-2xl rounded-tl-none border border-base-300 bg-base-200 px-4 py-3"
        >
          <div class="flex gap-1.5">
            <div
              class="h-2 w-2 animate-bounce rounded-full bg-primary"
              style="animation-delay: 0ms"
            ></div>
            <div
              class="h-2 w-2 animate-bounce rounded-full bg-secondary"
              style="animation-delay: 150ms"
            ></div>
            <div
              class="h-2 w-2 animate-bounce rounded-full bg-warning"
              style="animation-delay: 300ms"
            ></div>
          </div>
        </div>
      </div>
    }

    <div class="h-4 shrink-0"></div>
  </div>

  @if (showScrollButton()) {
    <button
      (click)="scrollToBottom()"
      class="btn absolute right-6 bottom-6 z-10 btn-circle btn-primary"
    >
      <svg lucideArrowDown class="h-5 w-5 group-hover:animate-bounce"></svg>
      @if (hasNewMessages()) {
        <span
          class="absolute -top-1 -right-1 h-3 w-3 rounded-full border-2 border-base-100 bg-error"
        ></span>
      }
    </button>
  }
</div>
