<div class="relative flex h-full min-w-0 flex-col bg-base-100">
  <!-- Session loading spinner (direct URL navigation) -->
  @if (isSessionLoading()) {
    <div
      class="absolute inset-0 z-30 flex flex-col items-center justify-center gap-3 bg-base-100/80 backdrop-blur-sm"
    >
      <span class="loading loading-md loading-spinner text-primary"></span>
      <span class="text-xs text-base-content/50">Loading conversation…</span>
    </div>
  }

  @if (showVoiceControl()) {
    <div
      class="absolute top-4 right-0 left-0 z-20 flex justify-center px-4 transition-all duration-300 ease-in-out"
    >
      <app-voice-control
        [currentTime]="currentAudioTime()"
        [totalDuration]="totalAudioDuration()"
        [playing]="isPlaying()"
        [loading]="ttsLoading()"
        [ttsFailed]="ttsFailed()"
        [levels]="ttsLevels()"
        (paused)="pauseAudio.emit()"
        (resumed)="resumeAudio.emit()"
        (retryRequested)="retryAudio.emit()"
        (audioSeeked)="seekAudio.emit($event)"
        (stopped)="onStopAudio()"
      />
    </div>
  }

  <div
    class="min-w-0 flex-1 overflow-x-hidden overflow-y-auto scroll-smooth"
    #scrollContainer
    (scroll)="onScroll()"
  >
    <div
      class="mx-auto flex w-full max-w-4xl min-w-0 flex-col gap-6 px-4 pt-6 sm:px-6"
    >
      @if (showVoiceControl()) {
        <div class="h-8"></div>
      }
      @if (messages().length === 0 && !loading()) {
        <app-chat-welcome
          [learningLanguage]="learningLanguage()"
          class="min-w-0 flex-1"
        />
      }
      @for (message of messages(); track $index) {
        <app-message-item
          class="min-w-0"
          [message]="message"
          [isPlaying]="isPlaying() && playingMessageIndex() === $index"
          (playRequested)="onPlayMessage($index, message.text)"
          (stop)="onStopAudio()"
          (retry)="retryMessage.emit($index)"
          (fork)="forkSession.emit($index)"
        />
      }
      @if (loading()) {
        <div class="flex min-w-0 items-center gap-3">
          <div class="avatar avatar-placeholder shrink-0">
            <div class="w-8 rounded-full bg-secondary text-secondary-content">
              <span class="text-xs font-bold">AI</span>
            </div>
          </div>
          <span class="loading loading-sm loading-dots"></span>
          <span class="text-xs text-base-content/50">Thinking…</span>
        </div>
      }
    </div>
  </div>

  @if (showScrollButton()) {
    <div class="absolute bottom-6 left-1/2 z-10 -translate-x-1/2">
      <div class="tooltip tooltip-left" data-tip="Scroll to bottom">
        <div class="indicator">
          @if (hasNewMessages()) {
            <span class="indicator-item badge badge-xs badge-error"></span>
          }
          <button
            (click)="scrollToBottom()"
            class="btn btn-circle border border-base-300 bg-base-200 shadow-lg btn-md"
            aria-label="Scroll to bottom"
          >
            <svg lucideArrowDown class="h-4 w-4"></svg>
          </button>
        </div>
      </div>
    </div>
  }
</div>
