<div class="relative flex h-full flex-col">
  @if (showVoiceControl()) {
    <div
      class="absolute top-4 left-1/2 z-20 w-full max-w-md -translate-x-1/2 transform px-4 transition-all duration-300 ease-in-out"
    >
      <app-voice-control
        [currentTime]="currentAudioTime()"
        [totalDuration]="totalAudioDuration()"
        (stopped)="onStopAudio()"
      />
    </div>
  }

  <div
    class="flex flex-1 flex-col space-y-4 overflow-y-auto scroll-smooth p-4"
    #scrollContainer
    (scroll)="onScroll()"
  >
    @if (showVoiceControl()) {
      <div class="h-16"></div>
    }
    @if (messages().length === 0 && !loading()) {
      <app-chat-welcome
        [learningLanguage]="learningLanguage()"
        class="flex-1"
      />
    }
    <!-- $index volontaire : flux de messages séquentiels sans identifiant UUID individuel côté client -->
    @for (message of messages(); track $index) {
      <app-message-item
        [message]="message"
        [isPlaying]="isPlaying() && playingMessageIndex() === $index"
        (playRequested)="onPlayMessage($index, message.text)"
        (stop)="onStopAudio()"
        (retry)="retryMessage.emit($index)"
        (fork)="forkSession.emit($index)"
      />
    }
    @if (loading()) {
      <div class="chat-start chat">
        <div class="avatar chat-image avatar-placeholder">
          <div class="w-10 rounded-full bg-secondary text-secondary-content">
            <span class="text-xs font-bold">AI</span>
          </div>
        </div>
        <div class="chat-header mb-1 text-xs opacity-60">AI Tutor</div>
        <div class="chat-bubble">
          <span class="loading loading-md loading-dots"></span>
        </div>
        <div class="chat-footer mt-1 text-xs opacity-50">Thinking…</div>
      </div>
    }

    <div class="h-4 shrink-0"></div>
  </div>

  @if (showScrollButton()) {
    <div class="absolute right-4 bottom-4 z-10">
      <div class="tooltip tooltip-left" data-tip="Scroll to bottom">
        <div class="indicator">
          @if (hasNewMessages()) {
            <span class="indicator-item badge badge-xs badge-error"></span>
          }
          <button
            (click)="scrollToBottom()"
            class="btn btn-circle btn-primary btn-sm shadow-md"
            aria-label="Scroll to bottom"
          >
            <svg lucideArrowDown class="h-4 w-4"></svg>
          </button>
        </div>
      </div>
    </div>
  }
</div>
