<div class="flex w-full flex-col gap-2">
  @if (pinnedSessions().length > 0) {
    <div class="flex flex-col gap-0.5">
      <div
        class="flex items-center gap-1.5 px-3 pt-2 pb-1 text-[11px] font-semibold tracking-wider text-base-content/50 uppercase"
      >
        <svg lucidePin class="h-3 w-3 text-primary"></svg>
        <span>Pinned</span>
      </div>
      <ul class="m-0 flex w-full list-none flex-col gap-0.5 p-0">
        @for (item of pinnedSessions(); track item.id) {
          <li class="group relative w-full overflow-visible">
            <app-session-list-item
              [session]="item"
              [isActive]="activeSessionId() === item.id"
              [editing]="editingSessionId() === item.id"
              [draft]="editTitle()"
              [highlightTerm]="highlightTerm()"
              (draftChange)="editTitle.set($event)"
              (selected)="sessionClick.emit($event)"
              (share)="shareConversation($event)"
              (pinToggled)="togglePin($event)"
              (renameRequested)="startRename($event)"
              (saveRename)="saveRename($event)"
              (cancelRename)="cancelRename()"
              (deleteRequested)="initDelete($event)"
            />
          </li>
        }
      </ul>
    </div>
  }
  <div class="flex flex-col gap-0.5">
    <div
      class="flex items-center justify-between px-3 pt-1.5 pb-1 text-[11px] font-semibold tracking-wider text-base-content/50 uppercase"
    >
      <span>Recents</span>
      <div class="flex items-center gap-0.5">
        <div class="dropdown dropdown-end dropdown-bottom">
          <button
            tabindex="0"
            type="button"
            class="btn btn-circle h-6 min-h-0 w-6 btn-ghost text-base-content/50 btn-xs hover:text-base-content"
            title="Sort options"
            aria-label="Sort options"
          >
            <svg lucideSlidersHorizontal class="h-3 w-3" />
          </button>
          <ul
            tabindex="0"
            class="menu dropdown-content z-50 mt-1 w-44 rounded-2xl border border-base-300 bg-base-200/95 p-1.5 shadow-2xl backdrop-blur-md"
          >
            <li
              class="menu-title px-2 py-1 text-[10px] text-base-content/40 uppercase"
            >
              Sort by
            </li>
            <li>
              <button
                type="button"
                (click)="sortBy.set('activity')"
                class="flex items-center justify-between rounded-xl py-1.5 text-xs"
                [class.font-semibold]="sortBy() === 'activity'"
                [class.text-primary]="sortBy() === 'activity'"
              >
                <span>Last activity</span>
                @if (sortBy() === 'activity') {
                  <svg lucideCheck class="h-3.5 w-3.5" />
                }
              </button>
            </li>
            <li>
              <button
                type="button"
                (click)="sortBy.set('created')"
                class="flex items-center justify-between rounded-xl py-1.5 text-xs"
                [class.font-semibold]="sortBy() === 'created'"
                [class.text-primary]="sortBy() === 'created'"
              >
                <span>Date created</span>
                @if (sortBy() === 'created') {
                  <svg lucideCheck class="h-3.5 w-3.5" />
                }
              </button>
            </li>
            <li>
              <button
                type="button"
                (click)="sortBy.set('name')"
                class="flex items-center justify-between rounded-xl py-1.5 text-xs"
                [class.font-semibold]="sortBy() === 'name'"
                [class.text-primary]="sortBy() === 'name'"
              >
                <span>Name</span>
                @if (sortBy() === 'name') {
                  <svg lucideCheck class="h-3.5 w-3.5" />
                }
              </button>
            </li>
          </ul>
        </div>
        <button
          type="button"
          (click)="reloadHistory.emit(); $event.stopPropagation()"
          class="btn btn-circle h-6 min-h-0 w-6 btn-ghost text-base-content/50 btn-xs hover:text-base-content"
          title="Reload history"
          aria-label="Reload history"
          [disabled]="isReloading()"
        >
          <svg
            lucideRefreshCw
            class="h-3 w-3"
            [class.animate-spin]="isReloading()"
          />
        </button>
      </div>
    </div>
    <ul class="m-0 flex w-full list-none flex-col gap-0.5 p-0">
      @for (item of recentSessions(); track item.id) {
        <li class="group relative w-full overflow-visible">
          <app-session-list-item
            [session]="item"
            [isActive]="activeSessionId() === item.id"
            [editing]="editingSessionId() === item.id"
            [draft]="editTitle()"
            [highlightTerm]="highlightTerm()"
            (draftChange)="editTitle.set($event)"
            (selected)="sessionClick.emit($event)"
            (share)="shareConversation($event)"
            (pinToggled)="togglePin($event)"
            (renameRequested)="startRename($event)"
            (saveRename)="saveRename($event)"
            (cancelRename)="cancelRename()"
            (deleteRequested)="initDelete($event)"
          />
        </li>
      } @empty {
        @if (pinnedSessions().length === 0) {
          <li
            class="flex flex-col items-center gap-2 py-8 text-center text-base-content/40 italic"
          >
            <svg lucideMessageCircle class="h-8 w-8 opacity-50" />
            <span class="text-xs">No conversations yet</span>
          </li>
        }
      }
    </ul>
  </div>
  <app-share-dialog
    [session]="sharingSession()"
    [isOpen]="sharingSession() !== null"
    (closed)="closeShareDialog()"
  />
  <app-session-delete-dialog
    [title]="deleteDialogTitle()"
    (confirmed)="confirmDelete()"
    (cancelled)="cancelDelete()"
  />
</div>
